services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beautycrm_api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./.env.docker
    volumes:
      # optional for local dev: keep storage persistent
      - api_storage:/var/www/html/storage
      # Firebase service-account key (FCM HTTP v1)
      - ./firebase-service-account.json:/var/www/html/firebase-service-account.json:ro
      # Google Play service-account key (subscriptions / RTDN sync)
      - ./google-play-service-account.json:/var/www/html/google-play-service-account.json:ro
      # backups will be written to host folder (inside api/)
      - ./backups/mysql:/backups/mysql
      - ./backups/project:/backups/project
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: beautycrm_mysql
    environment:
      MYSQL_DATABASE: beautycrmapi
      MYSQL_USER: beautycrm
      MYSQL_PASSWORD: beautycrm
      MYSQL_ROOT_PASSWORD: root
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: beautycrm_redis
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  api_storage:
